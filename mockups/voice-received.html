<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>そっと届く声 — よりそい つながる</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/components.css">
<style>
  .vr-wrap { padding: 24px 20px calc(var(--nav-height) + var(--safe-bottom) + 24px); position: relative; z-index: 1; }
  .vr-hero {
    text-align: center;
    padding: 32px 16px 16px;
    position: relative;
  }
  .vr-hero__bird {
    width: 120px; height: 120px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--lavender-100), var(--peach-50));
    display: grid; place-items: center;
    margin: 0 auto;
    box-shadow: var(--shadow-glow);
    font-size: 64px;
    position: relative;
    animation: gentle-pulse 2.8s ease-in-out infinite;
  }
  .vr-hero__bird::after {
    content: "";
    position: absolute;
    inset: -10px;
    border: 2px dashed var(--lavender-200);
    border-radius: 50%;
    opacity: 0.6;
    animation: rotate 30s linear infinite;
  }
  @keyframes rotate { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  .vr-hero h1 { font: 600 22px/1.5 var(--font-jp-round); margin-top: 18px; }
  .vr-hero p { font: 400 14px/1.7 var(--font-jp); color: var(--text-secondary); margin-top: 8px; }

  /* メインの「そっと届く声」カード（大きめ） */
  .whisper-main {
    background: linear-gradient(135deg, var(--lavender-100) 0%, var(--peach-50) 50%, var(--matcha-50) 100%);
    border-radius: 28px;
    padding: 28px 24px;
    position: relative;
    overflow: hidden;
    margin-top: 24px;
    box-shadow: var(--shadow-floating);
  }
  .whisper-main::before, .whisper-main::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(245, 200, 74, 0.35) 0%, transparent 70%);
    pointer-events: none;
  }
  .whisper-main::before { top: -30px; right: -30px; width: 140px; height: 140px; }
  .whisper-main::after { bottom: -20px; left: -20px; width: 100px; height: 100px; background: radial-gradient(circle, rgba(199, 219, 168, 0.3) 0%, transparent 70%); }

  .whisper-main__chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: var(--radius-pill);
    background: rgba(255, 255, 255, 0.85);
    font: 500 12px/1 var(--font-jp-round);
    color: var(--lavender-600);
    margin-bottom: 18px;
  }
  .whisper-main__body {
    font: 400 18px/1.95 var(--font-jp);
    color: var(--text-primary);
    margin-bottom: 18px;
    position: relative;
  }
  .whisper-main__body::before {
    content: "“";
    position: absolute;
    top: -16px; left: -8px;
    font-size: 48px;
    color: var(--peach-200);
    font-family: serif;
  }
  .whisper-main__from {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-top: 14px;
    border-top: 1px dashed var(--border-soft);
    margin-bottom: 18px;
  }
  .whisper-main__from .avatar { width: 28px; height: 28px; background: var(--bg-card); }
  .whisper-main__from-name {
    font: 500 13px/1.3 var(--font-jp-round);
    color: var(--text-secondary);
  }
  .whisper-main__timer {
    font: 400 11px/1 var(--font-num);
    color: var(--text-tertiary);
    margin-left: auto;
  }
  .whisper-main__actions {
    display: flex;
    gap: 10px;
  }
  .whisper-main__actions .btn { flex: 1; }

  /* 返信下書きエリア */
  .reply-section {
    margin-top: 28px;
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    box-shadow: var(--shadow-card);
  }
  .reply-section__head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .reply-section__title { font: 500 14px/1.4 var(--font-jp-round); color: var(--text-primary); }

  .ai-help {
    background: var(--matcha-50);
    border: 1px solid var(--matcha-100);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: all var(--duration) var(--ease-spring);
  }
  .ai-help:hover { background: var(--matcha-100); }
  .ai-help__icon {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--bg-card);
    display: grid; place-items: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .ai-help__title { font: 500 13px/1.3 var(--font-jp-round); color: var(--matcha-600); }
  .ai-help__desc { font: 400 12px/1.5 var(--font-jp); color: var(--text-secondary); margin-top: 1px; }

  /* もうひとつの届く声（プレビュー） */
  .more-section {
    margin-top: 32px;
  }
  .more-section h3 {
    font: 500 14px/1 var(--font-jp-round);
    color: var(--text-secondary);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .more-preview {
    background: var(--bg-soft);
    border-radius: var(--radius-md);
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: all var(--duration) var(--ease-spring);
  }
  .more-preview:hover { transform: translateY(-1px); background: var(--peach-50); }
  .more-preview__text {
    flex: 1;
    font: 400 14px/1.6 var(--font-jp);
    color: var(--text-secondary);
  }
</style>
</head>
<body>

<div class="app-frame bg-pattern">

  <header class="app-header">
    <button class="app-header__back" onclick="location.href='home.html'">
      <span data-icon="back"></span>
    </button>
    <span class="text-h2">そっと とどく こえ</span>
  </header>

  <main class="vr-wrap">

    <!-- ヒーロー（ふうが運んできた） -->
    <div class="vr-hero">
      <div class="vr-hero__bird">🐦</div>
      <h1>ふわっと、こえが とどいたよ</h1>
      <p>ふうが はこんできました</p>
    </div>

    <!-- メインの届く声 -->
    <article class="whisper-main">
      <span class="whisper-main__chip">
        <span data-icon="whisper"></span>
        とどいた こえ
      </span>
      <p class="whisper-main__body">
さいきん、ちゃんと 眠れてる？<br><br>
わたしは あんまり 眠れなくて、夜中に 天井を 見つめてました。<br>
おなじような ひと、いるかな…？
      </p>
      <div class="whisper-main__from">
        <div class="avatar avatar--32" style="background: var(--lavender-100); font-size: 16px;">🐢</div>
        <span class="whisper-main__from-name">ある となりさんより</span>
        <span class="whisper-main__timer">あと 21じかん</span>
      </div>
      <div class="whisper-main__actions">
        <button class="btn btn--secondary">そっと とじる</button>
        <button class="btn btn--primary">そっと かえす</button>
      </div>
    </article>

    <!-- 返信エリア -->
    <section class="reply-section">
      <div class="reply-section__head">
        <span class="icon-pill icon-pill--matcha" style="width: 32px; height: 32px;">
          <span data-icon="leaf"></span>
        </span>
        <div class="reply-section__title">かえしを 書く</div>
      </div>
      <textarea class="textarea" placeholder="ことばが でなくても 大丈夫。
スタンプだけでも、ちゃんと とどくよ。" rows="3" style="min-height: 90px;"></textarea>

      <!-- AI補助 -->
      <div class="ai-help">
        <div class="ai-help__icon">🌱</div>
        <div class="grow">
          <div class="ai-help__title">ことばを 手つだってもらう</div>
          <div class="ai-help__desc">「うまく言えない」を、AIが やさしく 整えるよ</div>
        </div>
        <span data-icon="chevronRight" style="color: var(--text-tertiary);"></span>
      </div>

      <!-- スタンプ -->
      <div style="display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap;">
        <button class="reaction-chip"><span class="reaction-chip__emoji">🌸</span><span>うん</span></button>
        <button class="reaction-chip"><span class="reaction-chip__emoji">🌿</span><span>そっか</span></button>
        <button class="reaction-chip"><span class="reaction-chip__emoji">☁️</span><span>きいたよ</span></button>
        <button class="reaction-chip"><span class="reaction-chip__emoji">🌱</span><span>だいじょうぶ？</span></button>
        <button class="reaction-chip"><span class="reaction-chip__emoji">🍵</span><span>ありがと</span></button>
      </div>

      <button class="btn btn--primary btn--full mt-16">そっと とどける</button>
    </section>

    <!-- ほかの届く声 -->
    <section class="more-section">
      <h3><span data-icon="whisper"></span>ほかにも、とどいてるよ（2件）</h3>
      <div class="stack" style="--gap: 8px;">
        <div class="more-preview">
          <span style="font-size: 28px;">🦔</span>
          <div class="more-preview__text">「きょう、はじめて 主治医に〇〇って 伝えられた…」</div>
          <span data-icon="chevronRight" style="color: var(--text-tertiary);"></span>
        </div>
        <div class="more-preview">
          <span style="font-size: 28px;">🐧</span>
          <div class="more-preview__text">「みなさん、おやつ なにが すきですか？ふと きになって…」</div>
          <span data-icon="chevronRight" style="color: var(--text-tertiary);"></span>
        </div>
      </div>
    </section>

  </main>

  <!-- ボトムナビ -->
  <nav class="bottom-nav">
    <a class="bottom-nav__item" href="home.html"><span data-icon="home"></span><span>おうち</span></a>
    <a class="bottom-nav__item" href="stroll.html"><span data-icon="stroll"></span><span>おさんぽ</span></a>
    <div class="bottom-nav__center"><a class="fab-center" href="post.html"><span data-icon="plus"></span></a></div>
    <a class="bottom-nav__item is-active" href="notifications.html"><span data-icon="mail"></span><span>おたより</span></a>
    <a class="bottom-nav__item" href="profile.html"><span data-icon="profile"></span><span>わたし</span></a>
  </nav>

</div>

<script src="assets/js/icons.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
